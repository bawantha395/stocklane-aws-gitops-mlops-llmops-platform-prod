name: AWS credentials
description: >-
  Assume one of this project's delivery roles (arn:aws:iam::<account>:role/<project>-<role>) with the
  restricted CI user's access key. The user can do nothing else.
inputs:
  role:
    description: deploy or train
    required: true
  access-key-id:
    description: CI user key
    required: true
  secret-access-key:
    description: CI user secret
    required: true
runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT_NAME }}-${{ inputs.role }}
        aws-region: ${{ env.AWS_REGION }}
        allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
        aws-access-key-id: ${{ inputs.access-key-id }}
        aws-secret-access-key: ${{ inputs.secret-access-key }}
        role-skip-session-tagging: true
        role-duration-seconds: 7200
        role-session-name: stocklane-${{ github.run_id }}
