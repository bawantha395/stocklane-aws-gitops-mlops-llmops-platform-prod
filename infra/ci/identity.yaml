AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CI identity for Stocklane prod: one restricted IAM user for GitHub Actions that can only assume
  two roles - deploy (Terraform, image and web publishing) and train (SageMaker, forecast, model release).
Parameters:
  ProjectName:
    Type: String
    Default: stocklane-prod
    AllowedPattern: '[a-z][a-z0-9-]{2,25}'
  StateBucketName:
    Type: String
  HostedZoneId:
    Type: String
    Description: The Route 53 zone the deploy role may change records in.
Resources:
  PipelineUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub '${ProjectName}-github-ci'
      Policies:
        - PolicyName: assume-delivery-roles
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-deploy'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-train'
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-deploy'
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt PipelineUser.Arn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: TerraformState
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${StateBucketName}'
                  - !Sub 'arn:${AWS::Partition}:s3:::${StateBucketName}/*'
              - Sid: ProjectBuckets
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-*/*'
              - Sid: ProjectServices
                Effect: Allow
                Action:
                  - lambda:*
                  - apigateway:*
                  - dynamodb:*
                  - cloudfront:*
                  - acm:*
                  - cognito-idp:*
                  - kms:*
                  - logs:*
                  - events:*
                  - sns:*
                  - budgets:*
                  - cloudwatch:*
                  - cloudtrail:*
                  - access-analyzer:*
                  - ecr:*
                  - sagemaker:CreateModelPackageGroup
                  - sagemaker:DeleteModelPackageGroup
                  - sagemaker:DescribeModelPackageGroup
                  - sagemaker:ListTags
                  - sagemaker:AddTags
                  - route53:Get*
                  - route53:List*
                  - tag:GetResources
                  - sts:GetCallerIdentity
                Resource: '*'
              - Sid: DnsRecords
                Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub 'arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}'
              - Sid: ProjectRolesOnly
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*'
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: '*'
              - Sid: NeverTouchTheCiIdentity
                Effect: Deny
                Action: iam:*
                Resource:
                  - !GetAtt PipelineUser.Arn
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-deploy'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-train'
  TrainRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-train'
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt PipelineUser.Arn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: train
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ModelsBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-models-${AWS::AccountId}'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-models-${AWS::AccountId}/*'
              - Sid: DataKey
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: '*'
                Condition:
                  ForAnyValue:StringEquals:
                    kms:ResourceAliases: !Sub 'alias/${ProjectName}'
              - Sid: TrainingJobs
                Effect: Allow
                Action:
                  - sagemaker:CreateProcessingJob
                  - sagemaker:DescribeProcessingJob
                  - sagemaker:StopProcessingJob
                  - sagemaker:CreateTrainingJob
                  - sagemaker:DescribeTrainingJob
                  - sagemaker:StopTrainingJob
                  - sagemaker:AddTags
                  - sagemaker:CreateModelPackage
                  - sagemaker:DescribeModelPackage
                  - sagemaker:UpdateModelPackage
                  - sagemaker:ListModelPackages
                Resource: '*'
              - Sid: HandTheTrainingRoleToSageMaker
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-sagemaker-training'
                Condition:
                  StringEquals:
                    iam:PassedToService: sagemaker.amazonaws.com
              - Sid: ReadImages
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: ReadTrainingImage
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeImages
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}/*'
              - Sid: RefreshThePhotoFunction
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-vision'
              - Sid: Identity
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: '*'
Outputs:
  PipelineUserArn:
    Value: !GetAtt PipelineUser.Arn
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  TrainRoleArn:
    Value: !GetAtt TrainRole.Arn
